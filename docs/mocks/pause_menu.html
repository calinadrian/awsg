<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pause Menu</title>
<style>
  :root {
    --ink: rgba(13,21,23,.96); --side: rgba(9,13,15,.97); --surface: #141a22; --row: #10161c; --well: #07090c;
    --edge: #5d6679; --edge-dim: #2c323d; --steel: #9aa3b8; --steel-hi: #d4d9e4;
    --text: #e8eaf0; --muted: #8b93a6;
    --wine: #8a1f33; --wine-hi: #b83a50; --wine-lo: #2a0d16;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0b08; color: var(--text); font: 13px Georgia, "Times New Roman", serif; }
  .page { max-width: 1060px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-weight: normal; font-size: 18px; margin: 0 0 4px; }
  .lead { margin: 0 0 14px; font: 12px Arial, sans-serif; color: #8a8572; }
  .scene { position: relative; height: 480px; border-radius: 4px; box-shadow: inset 0 0 0 1px #2a281c; overflow: hidden;
           background: radial-gradient(ellipse at 50% 70%, #4b5a2a, #2a3518 50%, #121a0c); }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }

  /* The window: the settings' frame, cut down to a title and a column of buttons. */
  .win { position: absolute; left: 50%; top: 50%; width: 280px; transform: translate(-50%, -50%); border-radius: 2px; cursor: move;
         background: var(--ink); box-shadow: inset 0 0 0 1px var(--edge), 0 0 0 1px #000, 0 6px 24px rgba(0,0,0,.6); }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 16px 12px; font-size: 16px; color: var(--steel-hi); letter-spacing: .5px;
           box-shadow: inset 0 -1px 0 var(--edge-dim); }
  .gem { width: 11px; height: 11px; transform: rotate(45deg); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--steel), 0 0 0 1px #000; }
  .list { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
  .b { height: 34px; display: flex; align-items: center; justify-content: center; padding: 0 12px; font-size: 13px; color: var(--text); cursor: pointer;
       background: var(--row); box-shadow: inset 0 0 0 1px var(--edge-dim), 0 0 0 1px #000; }
  .b:hover { background: var(--wine-lo); box-shadow: inset 0 0 0 1px var(--wine-hi), 0 0 0 1px #000; }
  .b.primary { background: var(--wine); box-shadow: inset 0 0 0 1px var(--wine-hi), 0 0 0 1px #000; }
  .b.primary:hover { background: var(--wine-hi); }
  .gap { height: 1px; margin: 3px 0; background: var(--edge-dim); }
</style>
</head>
<body>
<div class="page">
  <h1>Pause menu</h1>
  <p class="lead">The settings window's frame and colours. Resume is the crimson primary; the other rows turn wine on hover. Drag it by the title or any gap.</p>
  <div class="scene">
    <div class="dim"></div>
    <div class="win">
      <div class="brand"><span class="gem"></span>Paused</div>
      <div class="list">
        <div class="b primary">Resume</div>
        <div class="b">Settings</div>
        <div class="gap"></div>
        <div class="b">Abandon run</div>
        <div class="b">Quit game</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
